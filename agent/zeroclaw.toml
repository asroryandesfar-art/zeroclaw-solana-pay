# ZeroClaw runtime configuration for the Solana Payment Assistant.
#
# This is the canonical, version-controlled copy. `scripts/setup.sh` links it to
# ~/.zeroclaw/config.toml (or set ZEROCLAW_CONFIG to point here).
#
# Secrets are NEVER inlined — they are referenced by environment-variable name
# (`*_env`) and live only in `.env`. Validate on your host with:
#   zeroclaw doctor && zeroclaw channel doctor
#
# NOTE: exact keys can vary by ZeroClaw version; keys marked [verify] should be
# checked against `docs/reference/api/config-reference.md` for your build.

# --- LLM provider (used ONLY for the single intent-extraction step) ----------
default_provider    = "openrouter"          # [verify] any provider ZeroClaw supports
default_model       = "openai/gpt-4o-mini"  # small, structured-output capable
default_temperature = 0.0                    # intent parsing must be deterministic
api_key_env         = "LLM_API_KEY"          # [verify] name-reference, not the key

# --- Memory: the invoice ledger + conversation context ----------------------
[memory]
backend  = "sqlite"
auto_save = true
# Exact-match ledger, not semantic recall — embeddings intentionally OFF.

[storage.provider.config]
db_url               = "agent/data/zeroclaw.sqlite"
connect_timeout_secs = 5

# --- Gateway: local control plane + WhatsApp webhook endpoint ----------------
[gateway]
bind             = "127.0.0.1:42617"
require_pairing  = true
allow_public_bind = false        # expose only via a tunnel, deliberately

# --- Autonomy: run the money path with NO LLM round-trips --------------------
[autonomy]
default_mode = "deterministic"   # [verify] SOP execution posture

# --- WhatsApp channel --------------------------------------------------------
# Cloud API mode. For a self-contained demo, switch to Web mode (see below).
[channels_config.whatsapp]
mode              = "cloud"                       # or "web"
phone_number_id   = "REPLACE_WITH_PHONE_NUMBER_ID"
token_env         = "WHATSAPP_TOKEN"
verify_token_env  = "WHATSAPP_VERIFY_TOKEN"
dm_only           = true
# PRIMARY AUTHORIZATION GATE: deny-by-default. Only these staff numbers can
# create charges. An empty list denies everyone (safe default).
allowed_users     = []                            # e.g. ["+6281234567890"]

# Web mode alternative (no Meta app required; pairs via QR):
# [channels_config.whatsapp]
# mode         = "web"
# session_path = "agent/data/whatsapp-session"
# dm_only      = true
# allowed_users = []
