[skill]
name        = "create_invoice"
description  = "Create an invoice (reference + Solana Pay URL) for an amount in an allowed token."
version      = "1.0.0"

# Thin wrapper over the stateless `solpay` binary. The model may only supply the
# amount, token, and an optional message; the merchant wallet, mint, and cluster
# come from the environment (locked config) and are never model-controlled.
#
# [verify] The exact argument-templating syntax is ZeroClaw-version specific.
# The security property does NOT depend on it: the command below omits the
# dangerous flags entirely, and `solpay` reads recipient/mint/cluster from env.
[[skill.tools]]
name        = "create_invoice"
kind        = "shell"
command     = "solpay create-url --amount {{amount}} --token {{token}} --message {{message}}"
timeout     = 10
# Arguments the model must not set (defaulted from env by solpay):
locked_args = ["--recipient", "--mint", "--cluster"]
