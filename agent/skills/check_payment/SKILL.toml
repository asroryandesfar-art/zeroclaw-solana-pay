[skill]
name        = "check_payment"
description  = "Verify on-chain whether an invoice has been paid (paid/pending/mismatch)."
version      = "1.0.0"

# The only skill that touches the network. All verification criteria — mint,
# recipient, cluster, commitment, RPC — are fixed from the environment and are
# never model-controlled; the model only supplies the invoice's reference and
# expected amount.
[[skill.tools]]
name        = "check_payment"
kind        = "shell"
command     = "solpay verify --reference {{reference}} --amount-base-units {{amount_base_units}}"
timeout     = 15
locked_args = ["--recipient", "--mint", "--cluster", "--commitment", "--rpc", "--rpc-fallback"]
