[skill]
name        = "send_qr"
description  = "Render a Solana Pay URL to a PNG QR code for sending over WhatsApp."
version      = "1.0.0"

# Renders offline. `solpay` validates that the URL is a `solana:` URL, so this
# can never rasterize an arbitrary link.
[[skill.tools]]
name    = "send_qr"
kind    = "shell"
command = "solpay render-qr --url {{url}} --out {{out}}"
timeout = 10
