# SOP: verify_payments — poll pending invoices and settle them.
#
# [verify] Expresses the ZeroClaw SOP engine model (cron trigger + deterministic
# mode + guarded transitions). Adapt field names to your ZeroClaw SOP schema.

name: verify_payments
description: Detect on-chain payments for pending invoices and confirm them.

# Cron-driven. Interval from POLL_INTERVAL_SECONDS.
trigger:
  source: cron
  interval_seconds: "{{env.POLL_INTERVAL_SECONDS}}"   # default 10

# Deterministic + fully automatic: verdicts come only from verified on-chain
# facts. Single-flight: one tick must not overlap the next.
mode: deterministic
single_flight: true

steps:
  - id: load_pending
    description: Fetch a batch of PENDING invoices.
    memory:
      query: { namespace: invoices, status: PENDING, limit: 50 }

  - id: process
    for_each: "{{load_pending.records}}"
    steps:
      - id: expire_check
        description: If past TTL or attempts exhausted, expire and skip.
        when: "{{now > invoice.expires_at or invoice.attempts >= env.POLL_MAX_ATTEMPTS}}"
        do:
          - memory: { transition: { reference: "{{invoice.reference}}", from: PENDING, to: EXPIRED } }
          - continue: true

      - id: bump_attempts
        memory: { update: { reference: "{{invoice.reference}}", attempts: "{{invoice.attempts + 1}}" } }

      - id: verify
        description: Ask solpay for a verdict (network).
        skill: check_payment
        args: { reference: "{{invoice.reference}}", amount_base_units: "{{invoice.amount_base_units}}" }
        on_exit:
          # RPC transient — treat as "unknown", keep PENDING, retry next tick.
          4: { continue: true }
          3: { alert_staff: "Config error verifying {{invoice.reference}}", continue: true }
          5: { alert_staff: "Internal error verifying {{invoice.reference}}", continue: true }

      - id: settle
        description: Apply the verdict with a compare-and-set guard (idempotent).
        branch_on: "{{verify.status}}"
        cases:
          paid:
            # Guard: transition only if still PENDING → confirmation fires once.
            - memory:
                transition:
                  reference: "{{invoice.reference}}"
                  from: PENDING
                  to: PAID
                  set: { signature: "{{verify.signature}}", slot: "{{verify.slot}}" }
                on_applied:
                  - channel: { send: "Invoice #{{invoice.invoice_no}} Paid ✅" }
          mismatch:
            - memory:
                transition:
                  reference: "{{invoice.reference}}"
                  from: PENDING
                  to: FAILED
                  set: { failure_reason: "{{verify.reason}}" }
                on_applied:
                  - alert_staff: "Invoice #{{invoice.invoice_no}} FAILED: {{verify.reason}}"
          pending:
            - continue: true   # not yet; try again next tick
